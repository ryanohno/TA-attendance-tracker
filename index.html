<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIS 141 Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #111;
      padding: 1.25rem 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2.25rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .meta-box {
      background: #f1f4f6;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin: 1.25rem 0;
      font-size: 0.8rem;
      color: #555;
      line-height: 1.45;
      text-align: left;
    }
    .meta-box div span {
      font-weight: 600;
      color: #222;
    }
    .mode-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .status {
      margin: 1rem 0;
      font-size: 0.9rem;
      font-weight: 500;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 0.35rem;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      background-color: #fff;
    }
    input:focus, select:focus {
      border-color: #111;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #111827;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #374151;
    }
    #qrcodeContainer {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    #qrImage {
      width: 230px;
      height: 230px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .admin-footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .admin-toggle-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-weight: normal;
      width: auto;
    }
    .admin-toggle-btn:hover {
      background: none;
      color: #4b5563;
    }
    .credits {
      font-size: 0.7rem;
      color: #9ca3af;
      letter-spacing: 0.02em;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Main View -->
  <div class="card" id="mainBox">
    <h2 id="mainTitle">VIS 141 Attendance</h2>
    
    <div class="meta-box">
      <div>Time: <span id="clientTime">--:--:--</span></div>
      <div>IP: <span id="clientIp">Checking...</span></div>
    </div>

    <div id="sessionModeNotice" class="mode-badge">Checking schedule...</div>
    <div id="statusMsg" class="status">Loading...</div>

    <!-- QR Section (Shown when instructor opened session) -->
    <div id="qrSection" class="hidden">
      <div id="qrcodeContainer">
        <img id="qrImage" src="" alt="Attendance QR Code">
      </div>
      <p id="qrTimer" style="font-weight: 600; color: #16a34a; font-size: 0.95rem; margin: 0.5rem 0;"></p>
      <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 1.25rem;">Scan this QR code with mobile camera to check in.</p>
    </div>

    <!-- Student Attendance Form (Shown when token exists) -->
    <form id="attendanceForm" class="hidden">
      <label for="studentName">Full Name</label>
      <input type="text" id="studentName" required placeholder="e.g. Jane Doe">

      <label for="typeSelect">Attendance Type</label>
      <select id="typeSelect" required>
        <option value="Lecture">Lecture</option>
        <option value="Section">Section Meeting</option>
      </select>

      <label for="sectionSelect">Your Enrolled Section</label>
      <select id="sectionSelect" required>
        <option value="" disabled selected>Select your section</option>
        <option value="Section 1">Section 1</option>
        <option value="Section 2">Section 2</option>
      </select>

      <button type="submit" id="submitBtn">Submit Attendance</button>
    </form>

    <div class="admin-footer">
      <button class="admin-toggle-btn" onclick="toggleAdmin(true)">Admin Console</button>
      <div class="credits">Made by Ryan Oh</div>
    </div>
  </div>

  <!-- Admin View -->
  <div class="card hidden" id="adminBox">
    <h2>Admin Console</h2>
    <div class="meta-box">
      <div>Target: <span>Google Sheets API</span></div>
      <div>Time: <span id="adminTime">--:--:--</span></div>
    </div>

    <div id="adminAuth">
      <label for="adminKey">Admin Passkey</label>
      <input type="password" id="adminKey" placeholder="Enter key">

      <label for="duration">Session Duration (Minutes)</label>
      <input type="number" id="duration" value="15" min="1" max="180">

      <button onclick="startSession()">Open Session & Generate QR</button>
      <div id="adminStatus" class="status"></div>
    </div>

    <div class="admin-footer">
      <button class="admin-toggle-btn" onclick="toggleAdmin(false)">Return to Main Screen</button>
      <div class="credits">Made by Ryan Oh</div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxW8KekOze2i98L6l3-wmFUYlqkNfmyoCvUu3Fsf5_T_SW2AtyiFlKdSclwg8jvaH_xA/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token") || "";
    let currentClientIp = "Direct";
    let timerInterval = null;

    // Clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const elClient = document.getElementById("clientTime");
      const elAdmin = document.getElementById("adminTime");
      if (elClient) elClient.innerText = timeStr;
      if (elAdmin) elAdmin.innerText = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Schedule Notice
    function setupSchedule() {
      const today = new Date();
      const isWednesday = (today.getDay() === 3);
      const notice = document.getElementById("sessionModeNotice");
      const typeSelect = document.getElementById("typeSelect");

      if (isWednesday) {
        notice.innerText = "Wednesday: Full Lecture Attendance";
        notice.style.background = "#e0f2fe";
        notice.style.color = "#0369a1";
        if (typeSelect) typeSelect.value = "Lecture";
      } else {
        notice.innerText = "Section Attendance Mode";
        notice.style.background = "#f3f4f6";
        notice.style.color = "#374151";
        if (typeSelect) typeSelect.value = "Section";
      }
    }
    setupSchedule();

    // Safe IP fetch
    async function fetchIp() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        if (data && data.ip) {
          currentClientIp = String(data.ip);
          document.getElementById("clientIp").innerText = currentClientIp;
        }
      } catch (e) {
        document.getElementById("clientIp").innerText = "Direct";
      }
    }
    fetchIp();

    // Robust fetch wrapper
    async function callAppsScript(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // Page Router
    async function initPage() {
      const statusMsg = document.getElementById("statusMsg");

      // Case A: Student entered via QR scan (?token=...)
      if (token && token.length > 0) {
        statusMsg.innerText = "Validating session token...";
        statusMsg.style.color = "#4b5563";

        try {
          const res = await callAppsScript({ action: "validateToken", token: token });
          if (res && res.status === "valid") {
            statusMsg.innerText = "Session active. Enter your details below.";
            statusMsg.style.color = "#16a34a";
            document.getElementById("attendanceForm").classList.remove("hidden");
          } else {
            statusMsg.innerText = (res && res.message) ? res.message : "Attendance link is expired or invalid.";
            statusMsg.style.color = "#dc2626";
          }
        } catch (err) {
          statusMsg.innerText = "Connection error. Please refresh.";
          statusMsg.style.color = "#dc2626";
        }
        return;
      }

      // Case B: Main screen (Check if instructor session is open)
      statusMsg.innerText = "Checking active session...";
      try {
        const res = await callAppsScript({ action: "getActiveSession" });
        if (res && res.status === "active") {
          statusMsg.innerText = "";
          renderQr(res.token, Number(res.expiresAtMs));
        } else {
          statusMsg.innerText = "No Active Session. Waiting for instructor to open session.";
          statusMsg.style.color = "#6b7280";
        }
      } catch (err) {
        statusMsg.innerText = "No active session currently found.";
        statusMsg.style.color = "#6b7280";
      }
    }

    // Zero-dependency pure image QR rendering
    function renderQr(activeToken, expiresAtMs) {
      document.getElementById("mainTitle").innerText = "Attendance QR Code";
      document.getElementById("qrSection").classList.remove("hidden");

      const targetUrl = window.location.origin + window.location.pathname + "?token=" + encodeURIComponent(activeToken);
      const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(targetUrl);
      document.getElementById("qrImage").src = qrApiUrl;

      if (timerInterval) clearInterval(timerInterval);
      function updateTimer() {
        const remainingSec = Math.max(0, Math.floor((expiresAtMs - Date.now()) / 1000));
        const mins = Math.floor(remainingSec / 60);
        const secs = remainingSec % 60;
        document.getElementById("qrTimer").innerText = `Time Remaining: ${mins}m ${secs < 10 ? '0' : ''}${secs}s`;

        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          location.reload();
        }
      }
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    // Student Submit Handler
    document.getElementById("attendanceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      const nameInput = document.getElementById("studentName");
      const typeSelect = document.getElementById("typeSelect");
      const secSelect = document.getElementById("sectionSelect");

      const studentName = nameInput ? String(nameInput.value).trim() : "";
      const attendanceType = typeSelect ? String(typeSelect.value) : "Lecture";
      const selectedSection = secSelect ? String(secSelect.value) : "";

      if (!selectedSection) {
        alert("Please select your enrolled section.");
        return;
      }

      btn.disabled = true;
      statusMsg.innerText = "Submitting attendance...";
      statusMsg.style.color = "#4b5563";

      const finalRecord = attendanceType === "Lecture" 
        ? `Lecture (${selectedSection})` 
        : selectedSection;

      try {
        const res = await callAppsScript({
          action: "submitAttendance",
          token: token,
          name: studentName,
          section: finalRecord,
          clientIp: currentClientIp
        });

        if (res && res.status === "success") {
          document.getElementById("attendanceForm").classList.add("hidden");
          statusMsg.innerText = res.message || "Attendance recorded successfully.";
          statusMsg.style.color = "#16a34a";
        } else {
          statusMsg.innerText = (res && res.message) ? res.message : "Submission failed.";
          statusMsg.style.color = "#dc2626";
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.innerText = "Network timeout. Try submitting again.";
        statusMsg.style.color = "#dc2626";
        btn.disabled = false;
      }
    });

    // Admin Session Starter
    async function startSession() {
      const keyInput = document.getElementById("adminKey");
      const durInput = document.getElementById("duration");
      const adminStatus = document.getElementById("adminStatus");

      const adminKey = keyInput ? String(keyInput.value).trim() : "";
      const duration = durInput ? Number(durInput.value) : 15;

      adminStatus.innerText = "Starting session...";
      adminStatus.style.color = "#4b5563";

      try {
        const res = await callAppsScript({
          action: "createSession",
          adminKey: adminKey,
          durationMinutes: duration
        });

        if (res && res.status === "success") {
          toggleAdmin(false);
          renderQr(res.token, Number(res.expiresAtMs));
        } else {
          adminStatus.innerText = (res && res.message) ? res.message : "Authentication failed.";
          adminStatus.style.color = "#dc2626";
        }
      } catch (err) {
        adminStatus.innerText = "Failed to communicate with backend.";
        adminStatus.style.color = "#dc2626";
      }
    }

    function toggleAdmin(show) {
      if (show) {
        document.getElementById("mainBox").classList.add("hidden");
        document.getElementById("adminBox").classList.remove("hidden");
      } else {
        document.getElementById("adminBox").classList.add("hidden");
        document.getElementById("mainBox").classList.remove("hidden");
      }
    }

    initPage();
  </script>
</body>
</html>
