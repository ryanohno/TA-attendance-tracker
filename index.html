<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIS 141 Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #111;
      padding: 1.25rem 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2.25rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .meta-box {
      background: #f1f4f6;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin: 1.25rem 0;
      font-size: 0.8rem;
      color: #555;
      line-height: 1.45;
      text-align: left;
    }
    .meta-box div span {
      font-weight: 600;
      color: #222;
    }
    .mode-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .status {
      margin: 1rem 0;
      font-size: 0.9rem;
      font-weight: 500;
    }
    #errorBox {
      display: none;
      background: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      text-align: left;
      margin: 1rem 0;
      word-break: break-all;
      font-family: monospace;
      white-space: pre-wrap;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 0.35rem;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      background-color: #fff;
    }
    input:focus, select:focus {
      border-color: #111;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #111827;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #374151;
    }
    #qrcodeContainer {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    #qrImage {
      width: 230px;
      height: 230px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .admin-footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .admin-toggle-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-weight: normal;
      width: auto;
    }
    .admin-toggle-btn:hover {
      background: none;
      color: #4b5563;
    }
    .credits {
      font-size: 0.7rem;
      color: #9ca3af;
      letter-spacing: 0.02em;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Main View -->
  <div class="card" id="mainBox">
    <h2 id="mainTitle">VIS 141 Attendance</h2>
    
    <div class="meta-box">
      <div>Time: <span id="clientTime">--:--:--</span></div>
      <div>IP: <span id="clientIp">Checking...</span></div>
    </div>

    <div id="sessionModeNotice" class="mode-badge">Checking schedule...</div>
    <div id="statusMsg" class="status">Initializing...</div>
    <div id="errorBox"></div>

    <!-- QR Section -->
    <div id="qrSection" class="hidden">
      <div id="qrcodeContainer">
        <img id="qrImage" src="" alt="Attendance QR Code">
      </div>
      <p id="qrTimer" style="font-weight: 600; color: #16a34a; font-size: 0.95rem; margin: 0.5rem 0;"></p>
      <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 1.25rem;">Scan this QR code with mobile camera to check in.</p>
    </div>

    <!-- Student Attendance Form -->
    <form id="attendanceForm" class="hidden">
      <label for="studentName">Full Name</label>
      <input type="text" id="studentName" required placeholder="e.g. Jane Doe">

      <label for="typeSelect">Attendance Type</label>
      <select id="typeSelect" required>
        <option value="Lecture">Lecture</option>
        <option value="Section">Section Meeting</option>
      </select>

      <label for="sectionSelect">Your Enrolled Section</label>
      <select id="sectionSelect" required>
        <option value="" disabled selected>Select your section</option>
        <option value="Section 1">Section 1</option>
        <option value="Section 2">Section 2</option>
      </select>

      <button type="submit" id="submitBtn">Submit Attendance</button>
    </form>

    <div class="admin-footer">
      <button class="admin-toggle-btn" onclick="toggleAdmin(true)">Admin Console</button>
      <div class="credits">Made by Ryan Oh</div>
    </div>
  </div>

  <!-- Admin View -->
  <div class="card hidden" id="adminBox">
    <h2>Admin Console</h2>
    <div class="meta-box">
      <div>Target: <span>Google Sheets API</span></div>
      <div>Time: <span id="adminTime">--:--:--</span></div>
    </div>

    <div id="adminAuth">
      <label for="adminKey">Admin Passkey</label>
      <input type="password" id="adminKey" placeholder="Enter key">

      <label for="duration">Session Duration (Minutes)</label>
      <input type="number" id="duration" value="15" min="1" max="180">

      <button onclick="startSession()">Open Session & Generate QR</button>
      <div id="adminStatus" class="status"></div>
    </div>

    <div class="admin-footer">
      <button class="admin-toggle-btn" onclick="toggleAdmin(false)">Return to Main Screen</button>
      <div class="credits">Made by Ryan Oh</div>
    </div>
  </div>

  <script>
    // Global Error Logger to card box
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const errBox = document.getElementById("errorBox");
      if (errBox) {
        errBox.style.display = "block";
        errBox.innerText = "[Frontend Error]\n" + msg + "\nLine: " + lineNo + ":" + columnNo;
      }
      return false;
    };

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJL1qlCEFyxf1_j3efNG7gDg_aYTjRqHsMJo7fb4tZQIeMAzln68sQH44HooU4NniY/exec";

    // Safe Device UUID Generation (No reliance on fragile toString chains)
    function getSafeDeviceId() {
      let id = "";
      try {
        id = localStorage.getItem("vis141_dev_id") || "";
      } catch(e) {
        id = "";
      }
      if (!id) {
        id = "id_" + Math.floor(Math.random() * 1000000000) + "_" + Date.now();
        try {
          localStorage.setItem("vis141_dev_id", id);
        } catch(e) {}
      }
      return id;
    }
    const currentDeviceId = getSafeDeviceId();

    function getTodayString() {
      const now = new Date();
      return now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
    }

    let token = "";
    try {
      const params = new URLSearchParams(window.location.search);
      token = params.get("token") || "";
    } catch(e) {
      token = "";
    }

    let currentClientIp = "Direct";
    let timerInterval = null;

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const elClient = document.getElementById("clientTime");
      const elAdmin = document.getElementById("adminTime");
      if (elClient) elClient.innerText = timeStr;
      if (elAdmin) elAdmin.innerText = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function setupSchedule() {
      const today = new Date();
      const isWednesday = (today.getDay() === 3);
      const notice = document.getElementById("sessionModeNotice");
      const typeSelect = document.getElementById("typeSelect");

      if (isWednesday) {
        notice.innerText = "Wednesday: Full Lecture Attendance";
        notice.style.background = "#e0f2fe";
        notice.style.color = "#0369a1";
        if (typeSelect) typeSelect.value = "Lecture";
      } else {
        notice.innerText = "Section Attendance Mode";
        notice.style.background = "#f3f4f6";
        notice.style.color = "#374151";
        if (typeSelect) typeSelect.value = "Section";
      }
    }
    setupSchedule();

    async function fetchIp() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        if (data && data.ip) {
          currentClientIp = "" + data.ip;
          document.getElementById("clientIp").innerText = currentClientIp;
        }
      } catch (e) {
        document.getElementById("clientIp").innerText = "Direct";
      }
    }
    fetchIp();

    async function callAppsScript(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error("Invalid Server Output: " + text);
      }
    }

    async function initPage() {
      const statusMsg = document.getElementById("statusMsg");

      // 1. 학생 출석 링크 접근 (?token=...)
      if (token && token.length > 0) {
        let lastDate = "";
        try {
          lastDate = localStorage.getItem("vis141_submitted_date") || "";
        } catch(e) {}

        if (lastDate === getTodayString()) {
          statusMsg.innerText = "This device has already submitted attendance today.";
          statusMsg.style.color = "#dc2626";
          return;
        }

        statusMsg.innerText = "Validating session token...";
        statusMsg.style.color = "#4b5563";

        try {
          const res = await callAppsScript({ action: "validateToken", token: token });
          if (res && res.status === "valid") {
            statusMsg.innerText = "Session active. Enter your details below.";
            statusMsg.style.color = "#16a34a";
            document.getElementById("attendanceForm").classList.remove("hidden");
          } else {
            statusMsg.innerText = (res && res.message) ? res.message : "Attendance link is expired or invalid.";
            statusMsg.style.color = "#dc2626";
          }
        } catch (err) {
          statusMsg.innerText = "Error: " + err.message;
          statusMsg.style.color = "#dc2626";
        }
        return;
      }

      // 2. 메인 화면 세션 상태 확인
      statusMsg.innerText = "Checking active session...";
      try {
        const res = await callAppsScript({ action: "getActiveSession" });
        if (res && res.status === "active") {
          statusMsg.innerText = "";
          const safeExpiry = parseInt(res.expiresAtMs, 10) || 0;
          renderQr("" + res.token, safeExpiry);
        } else {
          statusMsg.innerText = "No Active Session. Waiting for instructor to open session.";
          statusMsg.style.color = "#6b7280";
        }
      } catch (err) {
        statusMsg.innerText = "No active session currently found.";
        statusMsg.style.color = "#6b7280";
      }
    }

    // QR 렌더링 및 NaN 방어 타이머
    function renderQr(activeToken, expiresAtMs) {
      document.getElementById("mainTitle").innerText = "Attendance QR Code";
      document.getElementById("qrSection").classList.remove("hidden");

      const targetUrl = window.location.origin + window.location.pathname + "?token=" + encodeURIComponent(activeToken);
      const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(targetUrl);
      document.getElementById("qrImage").src = qrApiUrl;

      if (timerInterval) clearInterval(timerInterval);

      function updateTimer() {
        const now = Date.now();
        const target = Number(expiresAtMs) || (now + 900000);
        const remainingSec = Math.max(0, Math.floor((target - now) / 1000));
        const mins = Math.floor(remainingSec / 60);
        const secs = remainingSec % 60;
        
        document.getElementById("qrTimer").innerText = "Time Remaining: " + mins + "m " + (secs < 10 ? "0" : "") + secs + "s";

        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          location.reload();
        }
      }
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    // 학생 제출
    document.getElementById("attendanceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      const nameInput = document.getElementById("studentName");
      const typeSelect = document.getElementById("typeSelect");
      const secSelect = document.getElementById("sectionSelect");

      const studentName = nameInput ? ("" + nameInput.value).trim() : "";
      const attendanceType = typeSelect ? ("" + typeSelect.value) : "Lecture";
      const selectedSection = secSelect ? ("" + secSelect.value) : "";

      if (!selectedSection) {
        alert("Please select your enrolled section.");
        return;
      }

      btn.disabled = true;
      statusMsg.innerText = "Submitting attendance...";
      statusMsg.style.color = "#4b5563";

      const finalRecord = attendanceType === "Lecture" 
        ? "Lecture (" + selectedSection + ")" 
        : selectedSection;

      try {
        const res = await callAppsScript({
          action: "submitAttendance",
          token: token,
          name: studentName,
          section: finalRecord,
          clientIp: currentClientIp,
          deviceId: currentDeviceId
        });

        if (res && res.status === "success") {
          try {
            localStorage.setItem("vis141_submitted_date", getTodayString());
          } catch(e) {}
          document.getElementById("attendanceForm").classList.add("hidden");
          statusMsg.innerText = res.message || "Attendance recorded successfully.";
          statusMsg.style.color = "#16a34a";
        } else {
          statusMsg.innerText = (res && res.message) ? res.message : "Submission failed.";
          statusMsg.style.color = "#dc2626";
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
        statusMsg.style.color = "#dc2626";
        btn.disabled = false;
      }
    });

    // 관리자 세션 시작
    async function startSession() {
      const keyInput = document.getElementById("adminKey");
      const durInput = document.getElementById("duration");
      const adminStatus = document.getElementById("adminStatus");

      const adminKey = keyInput ? ("" + keyInput.value).trim() : "";
      const duration = durInput ? Number(durInput.value) : 15;

      adminStatus.innerText = "Starting session...";
      adminStatus.style.color = "#4b5563";

      try {
        const res = await callAppsScript({
          action: "createSession",
          adminKey: adminKey,
          durationMinutes: duration
        });

        if (res && res.status === "success") {
          toggleAdmin(false);
          const safeExpiry = parseInt(res.expiresAtMs, 10) || (Date.now() + duration * 60000);
          renderQr("" + res.token, safeExpiry);
        } else {
          adminStatus.innerText = (res && res.message) ? res.message : "Authentication failed.";
          adminStatus.style.color = "#dc2626";
        }
      } catch (err) {
        adminStatus.innerText = "Error: " + err.message;
        adminStatus.style.color = "#dc2626";
      }
    }

    function toggleAdmin(show) {
      if (show) {
        document.getElementById("mainBox").classList.add("hidden");
        document.getElementById("adminBox").classList.remove("hidden");
      } else {
        document.getElementById("adminBox").classList.add("hidden");
        document.getElementById("mainBox").classList.remove("hidden");
      }
    }

    initPage();
  </script>
</body>
</html>
